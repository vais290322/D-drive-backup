<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../css/news.css">
  <title>News - Telecells Manager</title>
</head>
<body>
  <section id="news" class="page">
    <h1>Tech News</h1>
    
    <div class="news-categories">
      <button class="category-btn active" data-category="technology">Technology</button>
      <button class="category-btn" data-category="business">Business</button>
      <button class="category-btn" data-category="science">Science</button>
      <button class="category-btn" data-category="health">Health</button>
      <button class="category-btn" data-category="entertainment">Entertainment</button>
    </div>
    
    <div class="news-container" id="news-container">
      <!-- News articles will be added here -->
      <div class="loading">Loading news...</div>
    </div>
    
    <div class="news-pagination" id="news-pagination">
      <!-- Pagination buttons will be added here -->
    </div>
  </section>
  
  <script src="../js/news.js"></script>
</body>
</html>
