<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../css/employees.css">
  <title>Employees - Telecells Manager</title>
</head>
<body>
  <section id="employees" class="page">
    <h1>Employees</h1>
    <div class="action-bar">
      <button id="add-employee-btn" class="primary-btn">Add Employee</button>
      <div class="employee-filters">
        <div class="filter-group">
          <label class="filter-label">Department:</label>
          <select id="department-filter" class="filter-select">
            <option value="">All Departments</option>
            <option value="Sales">Sales</option>
            <option value="Support">Support</option>
            <option value="Technical">Technical</option>
            <option value="Marketing">Marketing</option>
            <option value="Administration">Administration</option>
          </select>
        </div>
        <input type="text" id="employee-search" placeholder="Search employees...">
      </div>
    </div>
    
    <div class="view-toggle">
      <button id="table-view-btn" class="view-btn active">Table View</button>
      <button id="grid-view-btn" class="view-btn">Grid View</button>
    </div>
    
    <div id="table-view" class="table-container">
      <table id="employees-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Position</th>
            <th>Department</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="employees-list">
          <!-- Employee rows will be added here -->
        </tbody>
      </table>
    </div>
    
    <div id="grid-view" class="employee-grid" style="display: none;">
      <!-- Employee grid cards will be added here -->
    </div>
    
    <!-- Employee Form Modal -->
    <div id="employee-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="employee-form-title">Add Employee</h2>
        <form id="employee-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="position">Position</label>
            <input type="text" id="position" name="position" required>
          </div>
          <div class="form-group">
            <label for="department">Department</label>
            <select id="department" name="department" required>
              <option value="">Select Department</option>
              <option value="Sales">Sales</option>
              <option value="Support">Support</option>
              <option value="Technical">Technical</option>
              <option value="Marketing">Marketing</option>
              <option value="Administration">Administration</option>
            </select>
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-actions">
            <button type="button" class="secondary-btn" id="cancel-employee">Cancel</button>
            <button type="submit" class="primary-btn">Save</button>
          </div>
        </form>
      </div>
    </div>
    
    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Confirm Delete</h2>
        <p>Are you sure you want to delete this employee? This action cannot be undone.</p>
        <div class="form-actions">
          <button type="button" class="secondary-btn" id="cancel-delete">Cancel</button>
          <button type="button" class="danger-btn" id="confirm-delete">Delete</button>
        </div>
      </div>
    </div>
  </section>
  
  <script src="../js/employees.js"></script>
</body>
</html>
