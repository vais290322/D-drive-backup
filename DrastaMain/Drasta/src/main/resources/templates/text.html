<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Initiatives</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          padding: 20px;
          background: #f4f4f4;
        }
        .category-block {
          padding: 20px;
          border-radius: 16px;
          box-shadow: 0 4px 8px rgba(0,0,0,0.1);
          margin-bottom: 40px;
        }
        .green { background-color: #d1fae5; }
        .blue { background-color: #dbeafe; }
        .yellow { background-color: #fef9c3; }

        .category-title {
          font-size: 20px;
          font-weight: bold;
        }

        .category-desc {
          color: #4b5563;
          margin-bottom: 16px;
        }

        .event-card {
          display: flex;
          background: #fff;
          border-radius: 12px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          padding: 12px;
          margin-bottom: 16px;
          gap: 12px;
          align-items: center;
        }

        .event-card img {
          width: 100px;
          height: 100px;
          object-fit: cover;
          border-radius: 8px;
        }

        .event-title {
          font-weight: 600;
          margin: 0;
        }

        .event-date {
          font-size: 12px;
          color: #6b7280;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 16px;
        }
    </style>
</head>
<body>

<div id="initiatives-container"></div>

<script>
    async function fetchInitiatives() {
      try {
        const response = await fetch('http://192.168.0.158:8080/api/v1/initiatives/grouped');
        const data = await response.json();
        renderInitiatives(data);
      } catch (err) {
        console.error('Failed to load initiatives:', err);
      }
    }

    function getColorClass(index) {
      const colors = ['green', 'blue', 'yellow'];
      return colors[index % colors.length];
    }

    function renderInitiatives(data) {
      const container = document.getElementById('initiatives-container');
      container.innerHTML = '';

      data.forEach((cat, idx) => {
        const block = document.createElement('div');
        block.className = `category-block ${getColorClass(idx)}`;

        const title = document.createElement('h2');
        title.className = 'category-title';
        title.textContent = cat.categoryTitle;

        const desc = document.createElement('p');
        desc.className = 'category-desc';
        desc.textContent = cat.categoryDescription;

        const eventGrid = document.createElement('div');
        eventGrid.className = 'grid';

        cat.events.forEach(event => {
          const card = document.createElement('div');
          card.className = 'event-card';

          const img = document.createElement('img');
          img.src = event.imageUrl;
          img.alt = event.title;

          const textBox = document.createElement('div');
          const eventTitle = document.createElement('h3');
          eventTitle.className = 'event-title';
          eventTitle.textContent = event.title;

          const eventDate = document.createElement('p');
          eventDate.className = 'event-date';
          eventDate.textContent = `Date: ${event.date}`;

          textBox.appendChild(eventTitle);
          textBox.appendChild(eventDate);
          card.appendChild(img);
          card.appendChild(textBox);
          eventGrid.appendChild(card);
        });

        block.appendChild(title);
        block.appendChild(desc);
        block.appendChild(eventGrid);
        container.appendChild(block);
      });
    }

    fetchInitiatives();
</script>
</body>

</html>
