<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="responsive-compatibility.css">
  <style>
    /* Animation Keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @keyframes slideInFromTop {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.05);
      }
      70% {
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
      }
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }
    
    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideInRight {
      from {
        transform: translateX(-20px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    @keyframes slideInUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    @keyframes slideInFromLeft {
      from {
        transform: translateX(-100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    @keyframes expandWidth {
      from {
        width: 0;
      }
      to {
        width: 60px;
      }
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #333;
      background-image: url('https://img.freepik.com/free-photo/top-view-table-full-delicious-food-composition_23-2149141352.jpg');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      position: relative;
      animation: fadeInUp 1s ease-out;
    }
    
    /* Animation Classes */
    .animate-on-scroll {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease-out;
    }
    
    .animate-on-scroll.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .animate-fade-in {
      animation: fadeInUp 0.8s ease-out;
    }
    
    .animate-slide-left {
      animation: fadeInLeft 0.8s ease-out;
    }
    
    .animate-slide-right {
      animation: fadeInRight 0.8s ease-out;
    }
    
    .animate-scale {
      animation: scaleIn 0.6s ease-out;
    }
    
    .animate-bounce {
      animation: bounceIn 0.8s ease-out;
    }
    
    .animate-delay-1 {
      animation-delay: 0.2s;
    }
    
    .animate-delay-2 {
      animation-delay: 0.4s;
    }
    
    .animate-delay-3 {
      animation-delay: 0.6s;
    }
    
    .animate-delay-4 {
      animation-delay: 0.8s;
    }
    
    /* Language Switcher Styles */
    .language-switcher {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 9999;
      animation: slideInFromTop 0.8s ease-out;
    }
    
    .language-dropdown {
      position: relative;
      display: inline-block;
    }
    
    .language-btn {
      background: linear-gradient(145deg, rgba(212, 175, 55, 0.9), rgba(255, 215, 0, 0.9));
      border: 1px solid rgba(184, 134, 11, 0.8);
      border-radius: 20px;
      padding: 4px 8px;
      color: #3b2f00;
      font-weight: 500;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(184, 134, 11, 0.3);
      transition: all 0.3s ease;
      min-width: 60px;
      backdrop-filter: blur(10px);
    }
    
    .language-btn:hover {
      background: linear-gradient(145deg, rgba(255, 215, 0, 0.95), rgba(212, 175, 55, 0.95));
      box-shadow: 0 3px 8px rgba(184, 134, 11, 0.4);
      transform: translateY(-1px);
    }
    
    .language-icon {
      font-size: 0.8rem;
    }
    
    .dropdown-arrow {
      font-size: 0.6rem;
      margin-left: auto;
      transition: transform 0.3s ease;
    }
    
    .language-options {
      position: absolute;
      top: 100%;
      right: 0;
      background: linear-gradient(145deg, rgba(255, 215, 0, 0.95), rgba(212, 175, 55, 0.95));
      border: 1px solid rgba(184, 134, 11, 0.8);
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(184, 134, 11, 0.4);
      min-width: 120px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      margin-top: 3px;
      backdrop-filter: blur(10px);
    }
    
    .language-options.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .language-option {
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #3b2f00;
      font-weight: 500;
      font-size: 0.7rem;
      transition: background-color 0.3s ease;
      border-radius: 8px;
      margin: 2px;
    }
    
    .language-option:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(2px);
    }
    
    .language-option .flag {
      font-size: 0.9rem;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      z-index: -1;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 30px;
      background: linear-gradient(145deg, #d4af37, #ffd700, #b8860b, #d4af37);
      color: #3b2f00;
      position: relative;
      box-shadow: 0 8px 25px #8b6914, 0 4px 15px #b8860b, inset 0 4px 8px #ffd700, inset 0 -2px 4px #b8860b;
      text-shadow: 2px 2px 4px #b8860b;
      border-bottom: 3px solid #b8860b;
      transform: perspective(1000px) rotateX(2deg);
      animation: slideInFromTop 1s ease-out;
      overflow: hidden;
    }
    
    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 3s infinite;
      pointer-events: none;
    }
    
    .header-content {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
      animation: fadeInUp 1.2s ease-out;
    }
    
    .logo-container {
      margin-right: 20px;
    }
    
    .logo-container:hover {
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }
    
    .restaurant-info {
      text-align: center;
      flex: 1;
      animation: fadeInUp 1s ease-out 0.5s both;
      padding: 20px 15px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.05));
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.1);
      margin: 15px;
      position: relative;
      overflow: hidden;
    }
    
    .restaurant-info::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.1), transparent);
      animation: shimmer 4s infinite;
    }
    
    .header-contact-info {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #3b2f00;
      text-shadow: 2px 2px 4px #8b6914, 1px 1px 2px #b8860b, 0 0 6px #ffd700;
      transform: translateZ(10px);
      position: relative;
      background: linear-gradient(145deg, rgba(255,215,0,0.1), rgba(212,175,55,0.1));
      padding: 8px 15px;
      border-radius: 8px;
      box-shadow: inset 0 2px 4px rgba(255,215,0,0.3), 0 2px 6px rgba(139,105,20,0.4);
      display: inline-block;
    }
    
    .header-contact-row {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 5px;
    }
    
    .contact-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #666;
      transition: all 0.3s ease;
    }
    
    .contact-icon {
      margin-right: 5px;
    }
    
    .header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      width: 100%;
      height: 20px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23d4af37" fill-opacity="1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,138.7C960,139,1056,117,1152,117.3C1248,117,1344,139,1392,149.3L1440,160L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path></svg>');
      background-size: cover;
      background-repeat: no-repeat;
      box-shadow: 0 0 10px #bfa94a;
    }
    
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin: 10px 0;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8), 1px 1px 3px rgba(0,0,0,0.6);
      color: #3b2f00;
      transform: translateZ(20px);
      position: relative;
      animation: scaleIn 1s ease-out 0.7s both;
      background: linear-gradient(45deg, #1a1a1a, #2c2c2c, #000000);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    h1::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: linear-gradient(45deg, #d4af37, #ffd700, #b8860b);
      z-index: -1;
      border-radius: 15px;
      opacity: 0.3;
      filter: blur(10px);
    }
    
    h1:hover {
      animation: pulse 0.6s ease;
      transform: scale(1.08);
      text-shadow: 6px 6px 12px rgba(0,0,0,0.9), 3px 3px 6px rgba(0,0,0,0.7);
    }
    
    h2 {
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      font-size: 1.8rem;
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 2px solid #d4af37;
      position: relative;
      text-shadow: 1px 1px 2px #bfa94a, 0 0 5px #fffacd;
      animation: fadeInLeft 0.8s ease-out;
    }
    
    h2::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #d4af37, #ffd700, #d4af37);
      box-shadow: 0 0 8px #ffd700, 0 2px 4px #b8860b;
      animation: expandWidth 1s ease-out 0.5s both;
    }
    
    @keyframes expandWidth {
      from {
        width: 0;
      }
      to {
        width: 50px;
      }
    }
    
    h3 {
      font-weight: 400;
      margin-top: 10px;
      font-size: 1rem;
      color: #3b2f00;
      text-shadow: 2px 2px 4px #8b6914, 1px 1px 2px #b8860b, 0 0 8px #ffd700;
      transform: translateZ(15px);
      position: relative;
      animation: fadeInRight 0.8s ease-out 0.9s both;
      margin: 8px 0;
    }
    
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .menu {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      padding: 40px;
      position: relative;
      margin-bottom: 40px;
      border: 1px solid #e0e0e0;
      animation: scaleIn 0.8s ease-out;
      transition: all 0.3s ease;
    }
    
    .menu:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    
    .menu::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 10px;
      background: linear-gradient(90deg, #d4af37, #ffd700, #b8860b);
      box-shadow: 0 0 12px #ffd700, 0 4px 8px #b8860b;
      animation: slideInFromLeft 1s ease-out 0.3s both;
    }
    
    @keyframes slideInFromLeft {
      from {
        left: -100%;
      }
      to {
        left: 0;
      }
    }
    
    .section {
      margin-bottom: 40px;
      padding-bottom: 20px;
    }
    
    .section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
    }
    
    .item {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px dashed #e0e0e0;
      align-items: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateX(-20px);
      animation: fadeInLeft 0.6s ease-out forwards;
      border-radius: 8px;
      margin: 5px 0;
      position: relative;
      overflow: hidden;
    }
    
    .item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent);
      transition: left 0.5s ease;
    }
    
    .item:hover::before {
      left: 100%;
    }
    
    .item:hover {
      transform: translateX(10px) translateY(-3px) scale(1.02);
      background: linear-gradient(145deg, rgba(255,215,0,0.1), rgba(212,175,55,0.1));
      box-shadow: 8px 8px 20px rgba(139,105,20,0.3), inset 0 2px 4px rgba(255,215,0,0.2);
      color: #3b2f00;
      border-radius: 12px;
      padding: 20px 15px;
    }
    
    .item:nth-child(1) { animation-delay: 0.1s; }
    .item:nth-child(2) { animation-delay: 0.2s; }
    .item:nth-child(3) { animation-delay: 0.3s; }
    .item:nth-child(4) { animation-delay: 0.4s; }
    .item:nth-child(5) { animation-delay: 0.5s; }
    .item:nth-child(6) { animation-delay: 0.6s; }
    .item:nth-child(7) { animation-delay: 0.7s; }
    .item:nth-child(8) { animation-delay: 0.8s; }
    
    .item:last-child {
      border-bottom: none;
    }
    
    .item-details {
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 1;
    }
    
    .item-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    
    .item:hover .item-image {
      transform: scale(1.05);
    }
    
    .name-container {
      display: flex;
      align-items: center;
      margin-left: 10px;
    }
    
    .item-name {
      font-weight: 500;
      font-size: 1.1rem;
    }
    
    .food-type-tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .food-type-tag.veg {
      background-color: #4CAF50;
      color: white;
    }
    
    .food-type-tag.non-veg {
      background-color: #F44336;
      color: white;
    }
    
    .food-type-tag.egg {
      background-color: #FF9800;
      color: white;
    }
    
    .item-description {
      font-size: 0.9rem;
      color: #666;
      margin-top: 5px;
      margin-left: 10px;
      font-style: italic;
      max-width: 400px;
      line-height: 1.4;
    }
    
    .price-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    
    .price-option {
      font-weight: 700;
      color: #0047AB;
      font-size: 1.1rem;
      line-height: 1.3;
    }
    
    .price-label {
      font-size: 0.9rem;
      color: #666;
      font-weight: 500;
    }
    
    .price-value {
      font-weight: 700;
      color: #d4af37;
      text-shadow: 1px 1px 2px #bfa94a;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      font-style: italic;
      color: #666;
    }
    
    .empty-category {
      font-style: italic;
      color: #999;
      text-align: center;
      padding: 20px 0;
    }
    
    .admin-link {
      display: inline-block;
      text-align: center;
      margin-top: 20px;
      color: #3b2f00;
      background: linear-gradient(145deg, #d4af37, #ffd700, #b8860b);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 20px;
      border-radius: 30px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 12px #b8860b, inset 0 2px 4px #ffd700;
      text-shadow: 1px 1px 2px #b8860b;
    }
    
    .admin-link:hover {
      background: linear-gradient(145deg, #ffd700, #d4af37, #b8860b);
      transform: translateY(-4px);
      box-shadow: 0 8px 16px #b8860b, inset 0 2px 6px #ffd700;
      color: #3b2f00;
      text-shadow: 2px 2px 4px #b8860b;
    }
    
    footer {
      background: linear-gradient(145deg, #d4af37, #ffd700, #b8860b);
      color: #3b2f00;
      text-align: center;
      padding: 0.5rem;
      margin-top: 15px;
      box-shadow: inset 0 0 15px #b8860b, 0 -4px 8px #ffd700;
      border-radius: 10px 10px 0 0;
      text-shadow: 2px 2px 4px #b8860b;
      position: relative;
      overflow: hidden;
      font-size: 0.85rem;
    }
    
    footer::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 3s infinite;
      transform: rotate(45deg);
    }
    
    footer:hover {
      transform: translateY(-5px);
      box-shadow: inset 0 0 20px #b8860b, 0 8px 25px rgba(139,105,20,0.4);
    }
    
    .footer-content {
      max-width: 800px;
      margin: 0 auto;
      animation: fadeInUp 0.8s ease-out 0.5s both;
      position: relative;
      z-index: 1;
    }
    
    .contact-info {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
      animation: fadeInUp 0.8s ease-out 0.7s both;
    }
    
    .contact-item {
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      padding: 8px 12px;
      border-radius: 20px;
      position: relative;
    }
    
    .contact-item:hover {
      transform: scale(1.1) translateY(-2px);
      background: rgba(255,255,255,0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .contact-icon {
      font-size: 1.2rem;
    }
    
    /* Enhanced Responsive Design for All Devices */
    
    /* Large Desktop (1200px and up) */
    @media (min-width: 1200px) {
      .container {
        max-width: 1140px;
        margin: 0 auto;
      }
      
      .menu {
        padding: 40px;
      }
      
      .item {
        padding: 25px;
      }
    }
    
    /* Desktop (992px to 1199px) */
    @media (min-width: 992px) and (max-width: 1199px) {
      .menu {
        padding: 30px;
      }
      
      .item {
        padding: 20px;
      }
    }
    
    /* Tablet (768px to 991px) */
    @media (min-width: 768px) and (max-width: 991px) {
      .header {
        padding: 20px 0;
      }
      
      h1 {
        font-size: 2.2rem;
      }
      
      h3 {
        font-size: 1.1rem;
      }
      
      .menu {
        padding: 25px 20px;
        margin-bottom: 25px;
      }
      
      .item {
        padding: 18px;
        margin-bottom: 18px;

  <script>
    // Listen for language changes and update dynamic content
    window.addEventListener('languageChanged', () => {
      // Re-translate any dynamically loaded content
      if (window.languageManager) {
        window.languageManager.translatePage();
        
        // Re-translate price labels
        const halfLabels = document.querySelectorAll('.price-label');
        halfLabels.forEach(label => {
          if (label.textContent.includes(':')) {
            const text = label.textContent.trim();
            if (text.startsWith('Half') || text.includes('आधा') || text.includes('অর্ধেক')) {
              label.textContent = window.languageManager.getTextSync('half') + ': ';
            } else if (text.startsWith('Full') || text.includes('पूरा') || text.includes('পূর্ণ')) {
              label.textContent = window.languageManager.getTextSync('full') + ': ';
            }
          }
        });
        
        // Re-translate hours label
        const hoursElement = document.getElementById('restaurant-hours');
        if (hoursElement && hoursElement.textContent.includes(':')) {
          const operationalHours = hoursElement.textContent.split(': ')[1];
          if (operationalHours) {
            const hoursLabel = window.languageManager.getTextSync('hoursLabel');
            hoursElement.textContent = hoursLabel + ': ' + operationalHours;
          }
        }
        
        // Re-translate empty category message
        const emptyCategory = document.querySelector('.empty-category');
        if (emptyCategory) {
          emptyCategory.textContent = window.languageManager.getTextSync('noItemsAvailable');
        }
      }
    });
    
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Fetch categories
        const categoriesResponse = await fetch('/api/categories');
        const categories = await categoriesResponse.json();
        
        // Fetch available items only
        const itemsResponse = await fetch('/api/items?showAll=false');
        const items = await itemsResponse.json();
        
        // Group items by category
        const itemsByCategory = {};
        categories.forEach(category => {
          itemsByCategory[category.id] = [];
        });
        
        items.forEach(item => {
          if (item.category_id && itemsByCategory[item.category_id]) {
            itemsByCategory[item.category_id].push(item);
          }
        });
        
        // Generate menu HTML
        const menuContainer = document.getElementById('menu-container');
        menuContainer.innerHTML = '';
        
        // Populate floating category menu
        const categoryList = document.getElementById('category-list');
        const categoriesWithItems = categories.filter(category => {
          const categoryItems = itemsByCategory[category.id] || [];
          return categoryItems.length > 0;
        });
        
        categoryList.innerHTML = '';
        categoriesWithItems.forEach((category, index) => {
          const categoryItem = document.createElement('div');
          categoryItem.className = 'category-item';
          categoryItem.textContent = category.name;
          categoryItem.dataset.categoryId = category.id;
          if (index === 0) categoryItem.classList.add('active');
          categoryItem.addEventListener('click', () => scrollToCategory(category.id));
          categoryList.appendChild(categoryItem);
        });
        
        categories.forEach(category => {

      const closeModal = document.getElementById('close-modal');
      const feedbackForm = document.getElementById('feedback-form');

      let selectedRating = 0;

        feedbackModal.classList.add('active');
      });
      
      // Close modal when X is clicked

        feedbackModal.classList.remove('active');
      });

        if (e.target === feedbackModal) {
          feedbackModal.classList.remove('active');

      });

      stars.forEach(star => {
        star.addEventListener('mouseover', function() {
          const rating = this.getAttribute('data-rating');
          highlightStars(rating);
        });
        
        star.addEventListener('mouseout', function() {
          highlightStars(selectedRating);
        });
        
        star.addEventListener('click', function() {
          selectedRating = this.getAttribute('data-rating');
          highlightStars(selectedRating);
        });
      });
      
      function highlightStars(rating) {
        stars.forEach(star => {
          const starRating = star.getAttribute('data-rating');
          if (starRating <= rating) {
            star.classList.add('active');
          } else {
            star.classList.remove('active');
          }
        });
      }
      
      // Mobile number validation
      const mobileInput = document.getElementById('mobile');
      if (mobileInput) {
        mobileInput.addEventListener('input', function(e) {
          // Remove any non-numeric characters
          let value = e.target.value.replace(/\D/g, '');
          // Limit to 10 digits
          if (value.length > 10) {
            value = value.slice(0, 10);
          }
          e.target.value = value;
        });
      }
      
      // Scroll-triggered animations
      const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
      };
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.animationPlayState = 'running';
            entry.target.classList.add('animate-visible');
          }
        });
      }, observerOptions);
      
      // Observe elements for scroll animations
      const animatedElements = document.querySelectorAll('.animate-on-scroll, .item, .contact-item');
      animatedElements.forEach(el => {
        observer.observe(el);
      });
      
      // Add staggered animation to menu items when they load
      setTimeout(() => {
        const menuItems = document.querySelectorAll('.item');
        menuItems.forEach((item, index) => {
          item.style.animationDelay = `${index * 0.1}s`;
          item.style.opacity = '1';
        });
      }, 500);
      
      // Form submission
      feedbackForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const mobile = document.getElementById('mobile').value;
        const feedback = document.getElementById('feedback').value;
        
        if (selectedRating === 0) {
          alert('Please select a rating');
          return;
        }
        
        // Validate mobile number
        if (mobile.length !== 10) {
          alert('Please enter a valid 10-digit mobile number');
          return;
        }
        
        // Prepare WhatsApp message with all collected data
        const message = `Name: ${name}\nMobile: ${mobile}\nRating: ${selectedRating}/5 stars\nFeedback: ${feedback}`;
        const encodedMessage = encodeURIComponent(message);
        
        // Open WhatsApp with the feedback data
        window.open(`https://wa.me/918016791627?text=${encodedMessage}`, '_blank');
        
        // Close the modal
        feedbackModal.classList.remove('active');
        
        // Reset form
        feedbackForm.reset();
        selectedRating = 0;
        highlightStars(0);
      });
      
      // Floating category menu functionality
      const floatingMenuBtn = document.getElementById('floating-menu-btn');
      const categoryDropdown = document.getElementById('category-dropdown');
      let isMenuOpen = false;
      
      if (floatingMenuBtn && categoryDropdown) {
        floatingMenuBtn.addEventListener('click', () => {
          isMenuOpen = !isMenuOpen;
          floatingMenuBtn.classList.toggle('active', isMenuOpen);
          categoryDropdown.classList.toggle('show', isMenuOpen);
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.floating-category-menu')) {
            isMenuOpen = false;
            floatingMenuBtn.classList.remove('active');
            categoryDropdown.classList.remove('show');
          }
        });
      }
      
      // Scroll to category function
      window.scrollToCategory = function(categoryId) {
        const categoryElement = document.getElementById(`category-${categoryId}`);
        if (categoryElement) {
          categoryElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
          
          // Update active category in dropdown
          document.querySelectorAll('.category-item').forEach(item => {
            item.classList.remove('active');
          });
          const activeItem = document.querySelector(`[data-category-id="${categoryId}"]`);
          if (activeItem) {
            activeItem.classList.add('active');
          }
          
          // Close the dropdown
          isMenuOpen = false;
          if (floatingMenuBtn && categoryDropdown) {
            floatingMenuBtn.classList.remove('active');
            categoryDropdown.classList.remove('show');
          }
        }
      };
    });
  </script>


  </body>
