<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Dreems - System Health Check</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
      padding: 40px;
    }
    
    h1 {
      color: #1e3a8a;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .check-item {
      display: flex;
      align-items: center;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: #f8fafc;
      border-left: 4px solid #cbd5e1;
    }
    
    .check-item.success {
      background: #f0fdf4;
      border-left-color: #10b981;
    }
    
    .check-item.error {
      background: #fef2f2;
      border-left-color: #ef4444;
    }
    
    .check-item.warning {
      background: #fffbeb;
      border-left-color: #f59e0b;
    }
    
    .status-icon {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    
    .check-label {
      flex-grow: 1;
      font-weight: 500;
      color: #1e293b;
    }
    
    .check-value {
      font-size: 12px;
      color: #64748b;
      font-family: 'Courier New', monospace;
    }
    
    .button {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }
    
    .button:hover {
      background: #1e40af;
    }
    
    .button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
    
    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #1e3a8a;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    
    .info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      font-size: 13px;
      color: #1e40af;
    }
    
    .info-box strong {
      display: block;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏥 System Health Check</h1>
    <p class="subtitle">Digital Dreems Loan Management CRM</p>
    
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Running diagnostics...</p>
    </div>
    
    <div id="results" style="display: none;"></div>
    
    <div class="actions" id="actions" style="display: none;">
      <button class="button" onclick="runChecks()">🔄 Re-run Checks</button>
      <button class="button" onclick="window.location.href='/'">🏠 Go to App</button>
      <button class="button" onclick="window.location.href='/login'">🔐 Go to Login</button>
    </div>
    
    <div class="info-box">
      <strong>ℹ️ About This Page</strong>
      This health check page verifies that all system components are properly configured and working.
      If you see any errors, please check the PRODUCTION_CHECKLIST.md file for troubleshooting steps.
    </div>
  </div>

  <script>
    const checks = [];
    
    function addCheck(label, status, value = '') {
      checks.push({ label, status, value });
    }
    
    function getStatusIcon(status) {
      const icons = {
        success: '✅',
        error: '❌',
        warning: '⚠️',
        info: 'ℹ️'
      };
      return icons[status] || '•';
    }
    
    function renderResults() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = checks.map(check => `
        <div class="check-item ${check.status}">
          <span class="status-icon">${getStatusIcon(check.status)}</span>
          <span class="check-label">${check.label}</span>
          ${check.value ? `<span class="check-value">${check.value}</span>` : ''}
        </div>
      `).join('');
      
      document.getElementById('loading').style.display = 'none';
      resultsDiv.style.display = 'block';
      document.getElementById('actions').style.display = 'flex';
    }
    
    async function runChecks() {
      checks.length = 0;
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      document.getElementById('actions').style.display = 'none';
      
      // Check 1: Browser Support
      const isModernBrowser = 'fetch' in window && 'Promise' in window;
      addCheck(
        'Modern Browser Support',
        isModernBrowser ? 'success' : 'error',
        navigator.userAgent.split(' ').pop()
      );
      
      // Check 2: Local Storage
      try {
        localStorage.setItem('test', 'test');
        localStorage.removeItem('test');
        addCheck('Local Storage', 'success', 'Available');
      } catch (e) {
        addCheck('Local Storage', 'error', 'Not available');
      }
      
      // Check 3: Session Storage
      try {
        sessionStorage.setItem('test', 'test');
        sessionStorage.removeItem('test');
        addCheck('Session Storage', 'success', 'Available');
      } catch (e) {
        addCheck('Session Storage', 'error', 'Not available');
      }
      
      // Check 4: Cookies
      const cookiesEnabled = navigator.cookieEnabled;
      addCheck(
        'Cookies',
        cookiesEnabled ? 'success' : 'error',
        cookiesEnabled ? 'Enabled' : 'Disabled'
      );
      
      // Check 5: JavaScript
      addCheck('JavaScript', 'success', 'Enabled');
      
      // Check 6: Network Connection
      const isOnline = navigator.onLine;
      addCheck(
        'Network Connection',
        isOnline ? 'success' : 'error',
        isOnline ? 'Online' : 'Offline'
      );
      
      // Check 7: Screen Size
      const screenSize = `${window.innerWidth}x${window.innerHeight}`;
      addCheck('Screen Size', 'info', screenSize);
      
      // Check 8: Device Type
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      addCheck('Device Type', 'info', isMobile ? 'Mobile' : 'Desktop');
      
      // Check 9: HTTPS
      const isHTTPS = window.location.protocol === 'https:';
      addCheck(
        'Secure Connection (HTTPS)',
        isHTTPS ? 'success' : 'warning',
        window.location.protocol
      );
      
      // Check 10: Supabase URL (from meta tag or env)
      const supabaseUrl = 'https://acbqilavnfxjfilzwnjd.supabase.co';
      if (supabaseUrl) {
        addCheck('Supabase URL', 'success', supabaseUrl);
        
        // Check 11: Supabase Connectivity
        try {
          const response = await fetch(`${supabaseUrl}/rest/v1/`, {
            method: 'HEAD',
            mode: 'no-cors'
          });
          addCheck('Supabase Connection', 'success', 'Reachable');
        } catch (e) {
          addCheck('Supabase Connection', 'error', e.message);
        }
      } else {
        addCheck('Supabase URL', 'error', 'Not configured');
      }
      
      // Check 12: React App Availability
      try {
        const response = await fetch('/');
        if (response.ok) {
          addCheck('React App', 'success', 'Available');
        } else {
          addCheck('React App', 'error', `HTTP ${response.status}`);
        }
      } catch (e) {
        addCheck('React App', 'error', e.message);
      }
      
      // Check 13: Assets Loading
      try {
        const response = await fetch('/vite.svg');
        if (response.ok) {
          addCheck('Static Assets', 'success', 'Loading correctly');
        } else {
          addCheck('Static Assets', 'warning', 'Some assets may not load');
        }
      } catch (e) {
        addCheck('Static Assets', 'warning', 'Check failed');
      }
      
      // Check 14: Console Errors
      const hasConsoleErrors = window.consoleErrors && window.consoleErrors.length > 0;
      addCheck(
        'Console Errors',
        hasConsoleErrors ? 'warning' : 'success',
        hasConsoleErrors ? `${window.consoleErrors.length} errors detected` : 'None detected'
      );
      
      // Check 15: Performance
      if (window.performance && window.performance.timing) {
        const loadTime = window.performance.timing.loadEventEnd - window.performance.timing.navigationStart;
        addCheck(
          'Page Load Time',
          loadTime < 3000 ? 'success' : 'warning',
          `${loadTime}ms`
        );
      }
      
      renderResults();
    }
    
    // Capture console errors
    window.consoleErrors = [];
    const originalError = console.error;
    console.error = function(...args) {
      window.consoleErrors.push(args.join(' '));
      originalError.apply(console, args);
    };
    
    // Run checks on page load
    window.addEventListener('load', () => {
      setTimeout(runChecks, 500);
    });
  </script>
</body>
</html>
