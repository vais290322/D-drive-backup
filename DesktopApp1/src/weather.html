<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecells - Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* Animated background particles */
        .background-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 1.5s ease;
        }

        .sidebar:hover::before {
            left: 100%;
        }

        .logo {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            text-align: center;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        nav ul {
            list-style: none;
        }

        nav li {
            margin-bottom: 0.5rem;
            transform: translateX(-20px);
            opacity: 0;
            animation: slideIn 0.6s ease forwards;
        }

        nav li:nth-child(1) { animation-delay: 0.1s; }
        nav li:nth-child(2) { animation-delay: 0.2s; }
        nav li:nth-child(3) { animation-delay: 0.3s; }
        nav li:nth-child(4) { animation-delay: 0.4s; }
        nav li:nth-child(5) { animation-delay: 0.5s; }
        nav li:nth-child(6) { animation-delay: 0.6s; }

        @keyframes slideIn {
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        nav a {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        nav a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        nav a:hover::before {
            left: 100%;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateX(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        nav li.active a {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .weather-header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-header h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3); }
            to { text-shadow: 2px 2px 20px rgba(255, 255, 255, 0.3); }
        }

        .weather-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
        }

        /* Weather Grid */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            animation: fadeInUp 1s ease 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Weather Cards */
        .weather-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            animation: cardFloat 0.8s ease forwards;
            opacity: 0;
            transform: translateY(50px);
        }

        .weather-card:nth-child(1) { animation-delay: 0.1s; }
        .weather-card:nth-child(2) { animation-delay: 0.2s; }
        .weather-card:nth-child(3) { animation-delay: 0.3s; }
        .weather-card:nth-child(4) { animation-delay: 0.4s; }
        .weather-card:nth-child(5) { animation-delay: 0.5s; }
        .weather-card:nth-child(6) { animation-delay: 0.6s; }
        .weather-card:nth-child(7) { animation-delay: 0.7s; }
        .weather-card:nth-child(8) { animation-delay: 0.8s; }
        .weather-card:nth-child(9) { animation-delay: 0.9s; }
        .weather-card:nth-child(10) { animation-delay: 1.0s; }
        .weather-card:nth-child(11) { animation-delay: 1.1s; }
        .weather-card:nth-child(12) { animation-delay: 1.2s; }

        @keyframes cardFloat {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.8s ease;
        }

        .weather-card:hover::before {
            left: 100%;
        }

        .weather-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.25);
        }

        .city-name {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .weather-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .temperature {
            color: #FFD700;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: temperatureGlow 3s ease-in-out infinite;
        }

        @keyframes temperatureGlow {
            0%, 100% { color: #FFD700; }
            50% { color: #FFA500; }
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.8rem;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .detail-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .detail-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .detail-value {
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .condition {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            text-align: center;
            font-style: italic;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.8rem;
            border-radius: 10px;
            margin-top: 0.5rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                padding: 1rem;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .weather-grid {
                grid-template-columns: 1fr;
            }
            
            .weather-header h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .weather-card {
                padding: 1.5rem;
            }
            
            .temperature {
                font-size: 2rem;
            }
            
            .weather-details {
                grid-template-columns: 1fr;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Animated Background Particles -->
    <div class="background-particles" id="particles"></div>

    <div class="app-container">
        <aside class="sidebar">
            <h2 class="logo">🌟 Telecells</h2>
            <nav>
                <ul>
                    <li><a href="index.html">📊 Dashboard</a></li>
                    <li><a href="employees.html">👥 Employees</a></li>
                    <li><a href="calls.html">📞 Calls</a></li>
                    <li class="active"><a href="weather.html">☀️ Weather</a></li>
                    <li><a href="news.html">📰 News</a></li>
                    <li><a href="settings.html">⚙️ Settings</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <div class="weather-header">
                <h1>🌤️ India's Weather Dashboard</h1>
                <p>Real-time weather information from around the world</p>
            </div>

            <div class="weather-grid" id="weatherGrid">
                <!-- Weather cards will be populated by JavaScript -->
            </div>
        </main>
    </div>

    <script>
        // Weather data for 12 cities
        const weatherData = [
            {
                city: "Mumbai",
                country: "India",
                temperature: 31,
                condition: "Partly Cloudy",
                humidity: 70,
                windSpeed: 15,
                pressure: 1013,
                visibility: 8,
                icon: "⛅"
            },
            {
                city: "Kolkata",
                country: "India",
                temperature: 18,
                condition: "Sunny",
                humidity: 45,
                windSpeed: 12,
                pressure: 1020,
                visibility: 15,
                icon: "☀️"
            },
            {
                city: "Delhi",
                country: "India",
                temperature: 12,
                condition: "Rainy",
                humidity: 85,
                windSpeed: 8,
                pressure: 995,
                visibility: 5,
                icon: "🌧️"
            },
            {
                city: "Bangalore",
                country: "India",
                temperature: 22,
                condition: "Cloudy",
                humidity: 60,
                windSpeed: 10,
                pressure: 1018,
                visibility: 12,
                icon: "☁️"
            },
            {
                city: "Hyderabad",
                country: "India",
                temperature: 25,
                condition: "Clear Sky",
                humidity: 55,
                windSpeed: 18,
                pressure: 1022,
                visibility: 20,
                icon: "🌞"
            },
            {
                city: "Chennai",
                country: "India",
                temperature: 42,
                condition: "Hot & Sunny",
                humidity: 30,
                windSpeed: 5,
                pressure: 1008,
                visibility: 18,
                icon: "🔥"
            },
            {
                city: "Mysore",
                country: "India",
                temperature: 16,
                condition: "Overcast",
                humidity: 75,
                windSpeed: 7,
                pressure: 1002,
                visibility: 8,
                icon: "🌫️"
            },
            {
                city: "Pune",
                country: "India",
                temperature: 29,
                condition: "Thunderstorm",
                humidity: 90,
                windSpeed: 20,
                pressure: 1010,
                visibility: 6,
                icon: "⛈️"
            },
            {
                city: "Lucknow",
                country: "India",
                temperature: -5,
                condition: "Snowy",
                humidity: 95,
                windSpeed: 25,
                pressure: 988,
                visibility: 3,
                icon: "❄️"
            },
            {
                city: "Jaipur",
                country: "India",
                temperature: 35,
                condition: "Dusty",
                humidity: 25,
                windSpeed: 22,
                pressure: 1015,
                visibility: 4,
                icon: "🌪️"
            },
            {
                city: "Patna",
                country: "India",
                temperature: 8,
                condition: "Foggy",
                humidity: 80,
                windSpeed: 6,
                pressure: 1016,
                visibility: 2,
                icon: "🌁"
            },
            {
                city: "Bhubaneswar",
                country: "India",
                temperature: 24,
                condition: "Partly Sunny",
                humidity: 65,
                windSpeed: 11,
                pressure: 1019,
                visibility: 14,
                icon: "🌤️"
            }
        ];

        // Create animated background particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 2;
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                const delay = Math.random() * 6;
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.animationDelay = delay + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Create weather cards
        function createWeatherCards() {
            const weatherGrid = document.getElementById('weatherGrid');
            
            weatherData.forEach(weather => {
                const card = document.createElement('div');
                card.className = 'weather-card';
                
                card.innerHTML = `
                    <div class="city-name">
                        🌍 ${weather.city}, ${weather.country}
                    </div>
                    <div class="weather-icon">${weather.icon}</div>
                    <div class="temperature">${weather.temperature}°C</div>
                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-label">Humidity</div>
                            <div class="detail-value">${weather.humidity}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Wind Speed</div>
                            <div class="detail-value">${weather.windSpeed} km/h</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Pressure</div>
                            <div class="detail-value">${weather.pressure} hPa</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Visibility</div>
                            <div class="detail-value">${weather.visibility} km</div>
                        </div>
                    </div>
                    <div class="condition">${weather.condition}</div>
                `;
                
                // Add click event for card interaction
                card.addEventListener('click', () => {
                    card.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        card.style.transform = '';
                    }, 150);
                });
                
                weatherGrid.appendChild(card);
            });
        }

        // Simulate real-time updates
        function updateWeatherData() {
            const cards = document.querySelectorAll('.weather-card');
            cards.forEach((card, index) => {
                const tempElement = card.querySelector('.temperature');
                const currentTemp = parseInt(tempElement.textContent);
                const variation = Math.floor(Math.random() * 3) - 1; // -1, 0, or 1
                const newTemp = currentTemp + variation;
                
                if (Math.random() < 0.3) { // 30% chance to update
                    tempElement.style.transform = 'scale(1.1)';
                    setTimeout(() => {
                        tempElement.textContent = newTemp + '°C';
                        tempElement.style.transform = 'scale(1)';
                    }, 200);
                }
            });
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            createWeatherCards();
            
            // Update weather data every 30 seconds
            setInterval(updateWeatherData, 30000);
            
            // Add hover effects to sidebar links
            const sidebarLinks = document.querySelectorAll('nav a');
            sidebarLinks.forEach(link => {
                link.addEventListener('mouseenter', () => {
                    link.style.boxShadow = '0 0 20px rgba(255, 255, 255, 0.3)';
                });
                
                link.addEventListener('mouseleave', () => {
                    if (!link.parentElement.classList.contains('active')) {
                        link.style.boxShadow = '';
                    }
                });
            });
        });

        // Handle window resize for particles
        window.addEventListener('resize', () => {
            const particlesContainer = document.getElementById('particles');
            particlesContainer.innerHTML = '';
            createParticles();
        });
    </script>
</body>
</html>
