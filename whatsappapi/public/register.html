<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – WhatsApp SaaS</title>
  <meta name="description" content="Create a new WhatsApp SaaS account to connect your WhatsApp and start sending messages via API." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <h1>Whats<span>SaaS</span></h1>
        <p>Create a new account</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" class="form-control" placeholder="Min 6 characters" required minlength="6" />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input id="confirm" type="password" class="form-control" placeholder="Repeat password" required />
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Create Account</button>
      </form>

      <p style="text-align:center; margin-top:24px; font-size:0.88rem; color:var(--text-muted)">
        Already have an account? <a href="/index.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (getToken()) window.location.href = '/dashboard.html';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alertBox');
      const btn = document.getElementById('submitBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        return showAlert('alertBox', 'Passwords do not match', 'error');
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account…';

      const { ok, data } = await apiFetch('/auth/register', {
        method: 'POST',
        body: { email, password },
      }).catch((err) => ({ ok: false, data: { message: err.message } }));

      if (ok) {
        setSession(data);
        window.location.href = '/dashboard.html';
      } else {
        showAlert('alertBox', data.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
