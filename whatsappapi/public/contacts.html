<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacts – WhatsApp Controller</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }

        .filters .form-control {
            width: auto;
            flex: 1;
            min-width: 140px;
        }

        .hist-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .hist-table th {
            padding: 10px 14px;
            text-align: left;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            font-weight: 500;
            white-space: nowrap;
        }

        .hist-table td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: middle;
        }

        .hist-table tr:last-child td {
            border-bottom: none;
        }

        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            font-size: 1.1rem;
        }

        .contact-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.73rem;
            font-weight: 600;
            color: #fff;
            margin-right: 4px;
            margin-bottom: 4px;
            white-space: nowrap;
        }

        .msg-body {
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-muted);
        }

        .pager {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .pager span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">📱 <span>WhatsApp</span>&nbsp;Controller</div>
            <nav>
                <a href="/dashboard.html?v=3">🏠 Dashboard</a>
                <a href="/send.html?v=3">✉️ Send Message</a>
                <a href="/bulk.html">📤 Bulk Send</a>
                <a href="/inbox.html">💬 Inbox</a>
                <a href="/contacts.html" class="active">👥 Contacts</a>
                <a href="/history.html">📊 History</a>
                <a href="/templates.html">📋 Templates</a>
                <a href="/api.html">💻 Developer / API</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-badge" id="userEmail">—</div>
                <button id="logoutBtn" class="btn btn-secondary btn-sm btn-full">Sign Out</button>
            </div>
        </aside>

        <main class="main">
            <div class="page-header"
                style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
                <div>
                    <h2>Contacts</h2>
                    <p>Manage your WhatsApp contacts</p>
                </div>
                <div style="display:flex; gap: 8px;">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search name or number..."
                        style="width: 250px;">
                    <button id="searchBtn" class="btn btn-secondary btn-sm">Search</button>
                    <button id="cleanBtn" class="btn btn-secondary btn-sm"
                        title="Delete contacts with invalid (non-Indian) numbers from database"
                        style="color:var(--danger)">🗑 Clean Invalid</button>
                    <button id="syncBtn" class="btn btn-primary btn-sm">⬇️ Sync WhatsApp Contacts</button>
                </div>
            </div>

            <!-- Table -->
            <div class="card" style="padding:0;overflow:hidden;">
                <div style="overflow-x:auto;">
                    <table class="hist-table">
                        <thead>
                            <tr>
                                <th>Profile</th>
                                <th>Name / Phone</th>
                                <th>Display Name</th>
                                <th>About</th>
                                <th>Labels</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="contactBody">
                            <tr>
                                <td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted)">
                                    Loading…
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pager">
                <span id="pageInfo">—</span>
                <div style="display:flex;gap:8px;">
                    <button id="prevPage" class="btn btn-secondary btn-sm">Prev</button>
                    <button id="nextPage" class="btn btn-secondary btn-sm">Next</button>
                </div>
            </div>

            <!-- Edit Contact Modal -->
            <div id="editModal"
                style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center;">
                <div class="card" style="width: 400px; max-width: 90%; position: relative;">
                    <button onclick="closeEditModal()"
                        style="position:absolute; top:12px; right:12px; background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:1.2rem;">❌</button>
                    <h3 style="margin-top:0;">Edit Contact</h3>
                    <input type="hidden" id="editEncId">

                    <div class="form-group" style="margin-top:20px;">
                        <label>Display Name</label>
                        <input type="text" id="editDisplayName" class="form-control" placeholder="Custom Name">
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="editPhone" class="form-control" placeholder="91...">
                        <small style="color:var(--text-muted)">Must start with 91 followed by 10 digits.</small>
                    </div>

                    <div class="form-group">
                        <label>Labels</label>
                        <div id="editLabelsContainer" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
                        </div>
                        <div style="display:flex; gap:6px;">
                            <input type="text" id="newLabelName" class="form-control" placeholder="New label name"
                                style="flex:1">
                            <input type="color" id="newLabelColor" value="#6c47ff"
                                style="width:40px; height:38px; border:none; border-radius:4px; cursor:pointer; background:transparent;">
                            <button class="btn btn-secondary btn-sm" onclick="addLabelToEdit()">+</button>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-full" onclick="saveContactEdit()" style="margin-top:10px;">Save
                        Changes</button>
                </div>
            </div>

        </main>
    </div>

    <script src="/js/api.js"></script>
    <script>
        requireAuth();
        document.getElementById('userEmail').textContent = localStorage.getItem('email') || '';
        document.getElementById('logoutBtn').addEventListener('click', () => { clearSession(); window.location.href = '/index.html'; });

        let currentPage = 1;
        let totalPages = 1;

        function escHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        // Valid Indian number = exactly 91 followed by 10 digits (12 digits total)
        function isValidIndianNumber(phone) {
            return /^91\d{10}$/.test((phone || '').replace(/\D/g, ''));
        }

        // Format: 91XXXXXXXXXX → +91 XXXXX XXXXX
        function fmtPhone(phone) {
            const d = (phone || '').replace(/\D/g, '');
            if (/^91\d{10}$/.test(d)) {
                return `+91 ${d.slice(2, 7)} ${d.slice(7)}`;
            }
            return `+${d}`; // fallback (shouldn't normally reach here)
        }

        function initials(name) {
            if (!name) return '?';
            const clean = name.trim();
            if (/^\d+/.test(clean)) return '#'; // If it's just a raw phone number, show a #
            const parts = clean.split(/\s+/);
            if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        let currentSearch = '';
        let editCurrentLabels = [];

        function encodeId(id) {
            return btoa(id).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function loadContacts(page = 1) {
            const params = new URLSearchParams({ page, limit: 20 });
            if (currentSearch) params.set('search', currentSearch);

            const { ok, data } = await apiFetch(`/contacts?${params}`);
            const tbody = document.getElementById('contactBody');

            if (!ok) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger)">Failed to load</td></tr>';
                return;
            }

            currentPage = data.page;
            totalPages = data.pages;

            if (!data.contacts.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted)">No contacts found. Click Sync WhatsApp Contacts.</td></tr>';
                document.getElementById('pageInfo').textContent = '0 contacts';
                return;
            }

            // Filter to only valid Indian numbers
            const validContacts = data.contacts.filter(c => isValidIndianNumber(c.contactPhone));
            const skippedCount = data.contacts.length - validContacts.length;

            if (!validContacts.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted)">No valid contacts found. Click Sync WhatsApp Contacts.</td></tr>';
                document.getElementById('pageInfo').textContent = `0 valid contacts (${skippedCount} invalid hidden)`;
                return;
            }

            tbody.innerHTML = validContacts.map(c => {
                const cleanPhone = (c.contactPhone || c.chatId).replace(/@.*$/, '');
                const name = c.waName || c.displayName || fmtPhone(cleanPhone) || '?';

                let avatarHtml = `<div class="contact-avatar">${initials(name)}</div>`;
                if (c.profilePicUrl) {
                    avatarHtml = `<div class="contact-avatar"><img src="${c.profilePicUrl}" onerror="this.parentElement.innerHTML='${initials(name)}'" /></div>`;
                }

                let labelsHtml = '';
                if (c.labels && c.labels.length > 0) {
                    labelsHtml = c.labels.map(l => `<span class="label-chip" style="background:${l.color}">${escHtml(l.name)}</span>`).join('');
                } else {
                    labelsHtml = '<span style="color:var(--text-muted);font-size:0.75rem">None</span>';
                }

                const encId = encodeId(c.chatId);

                return `<tr>
                    <td>${avatarHtml}</td>
                    <td>
                        <div style="font-weight:600">${escHtml(c.waName || '—')}</div>
                        <div style="font-size:0.75rem;color:var(--text-muted);font-family:monospace">${escHtml(fmtPhone(cleanPhone))}</div>
                    </td>
                    <td>${escHtml(c.displayName || '—')}</td>
                    <td><div class="msg-body" title="${escHtml(c.about || '')}">${escHtml(c.about || '—')}</div></td>
                    <td>${labelsHtml}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="openChat('${encId}')">💬 Message</button>
                        <button class="btn btn-secondary btn-sm" onclick="openEditModal('${encId}', '${escHtml(c.displayName || '')}', '${escHtml(cleanPhone)}', '${encodeURIComponent(JSON.stringify(c.labels || []))}')">Edit</button>
                        <button class="btn btn-secondary btn-sm" style="color:var(--danger)" onclick="deleteContact('${encId}')">Delete</button>
                    </td>
                </tr>`;
            }).join('');

            const skippedNote = skippedCount ? ` • ${skippedCount} invalid hidden ⚠️` : '';
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} • ${data.total} total${skippedNote}`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
        }

        function openChat(encId) {
            window.location.href = `/inbox.html?chat=${encId}`;
        }

        function openEditModal(encId, name, phone, labelsJson) {
            document.getElementById('editEncId').value = encId;
            document.getElementById('editDisplayName').value = name;
            document.getElementById('editPhone').value = phone;
            try {
                editCurrentLabels = JSON.parse(decodeURIComponent(labelsJson));
            } catch (e) { editCurrentLabels = []; }

            renderEditLabels();
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function renderEditLabels() {
            const container = document.getElementById('editLabelsContainer');
            if (editCurrentLabels.length === 0) {
                container.innerHTML = '<span style="color:var(--text-muted); font-size:0.8rem;">No labels yet.</span>';
                return;
            }
            container.innerHTML = editCurrentLabels.map((l, i) => `
                <span class="label-chip" style="background:${l.color}">
                    ${escHtml(l.name)}
                    <span style="margin-left:6px; cursor:pointer;" onclick="removeLabelFromEdit(${i})">❌</span>
                </span>
            `).join('');
        }

        function addLabelToEdit() {
            const name = document.getElementById('newLabelName').value.trim();
            const color = document.getElementById('newLabelColor').value;
            if (!name) return;

            // Remove if exists
            editCurrentLabels = editCurrentLabels.filter(l => l.name.toLowerCase() !== name.toLowerCase());
            editCurrentLabels.push({ name, color });

            document.getElementById('newLabelName').value = '';
            renderEditLabels();
        }

        function removeLabelFromEdit(index) {
            editCurrentLabels.splice(index, 1);
            renderEditLabels();
        }

        async function saveContactEdit() {
            const encId = document.getElementById('editEncId').value;
            const displayName = document.getElementById('editDisplayName').value.trim();
            const contactPhone = document.getElementById('editPhone').value.trim();

            if (!/^91\d{10}$/.test(contactPhone)) {
                alert('Phone number must start with 91 followed by exactly 10 digits.');
                return;
            }

            const payload = { displayName, contactPhone, labels: editCurrentLabels };

            const btn = document.querySelector('#editModal .btn-primary');
            const orig = btn.textContent;
            btn.textContent = 'Saving...';
            btn.disabled = true;

            const { ok, data } = await apiFetch(`/contacts/${encId}`, { method: 'PUT', body: payload });

            btn.textContent = orig;
            btn.disabled = false;

            if (ok) {
                closeEditModal();
                loadContacts(currentPage);
            } else {
                alert('Failed to save: ' + (data ? data.message : 'Unknown error'));
            }
        }

        async function deleteContact(encId) {
            if (confirm('Are you sure you want to delete this contact completely?')) {
                await apiFetch(`/contacts/${encId}`, { method: 'DELETE' });
                loadContacts(currentPage);
            }
        }

        document.getElementById('searchBtn').addEventListener('click', () => {
            currentSearch = document.getElementById('searchInput').value.trim();
            loadContacts(1);
        });

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                currentSearch = e.target.value.trim();
                loadContacts(1);
            }
        });

        document.getElementById('prevPage').addEventListener('click', () => { if (currentPage > 1) loadContacts(currentPage - 1); });
        document.getElementById('nextPage').addEventListener('click', () => { if (currentPage < totalPages) loadContacts(currentPage + 1); });

        // â”€â”€ Sync WhatsApp Contacts â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        document.getElementById('syncBtn').addEventListener('click', async () => {
            const btn = document.getElementById('syncBtn');
            const origText = btn.textContent;
            btn.textContent = 'Syncing...';
            btn.disabled = true;

            const { ok, data } = await apiFetch(`/contacts/sync`, { method: 'POST' });
            if (ok) {
                alert(data.message);
                loadContacts(1);
            } else {
                alert('Sync failed: ' + (data ? data.message : 'Unknown error'));
            }

            btn.textContent = origText;
            btn.disabled = false;
        });

        // ── Clean Invalid Contacts ────────────────────────────────────────────────
        document.getElementById('cleanBtn').addEventListener('click', async () => {
            if (!confirm('This will permanently delete all contacts with invalid/non-Indian phone numbers from the database. Continue?')) return;
            const btn = document.getElementById('cleanBtn');
            btn.textContent = 'Cleaning...';
            btn.disabled = true;
            const { ok, data } = await apiFetch('/contacts/clean', { method: 'DELETE' });
            btn.textContent = '🗑 Clean Invalid';
            btn.disabled = false;
            if (ok) {
                alert(`✅ Done! ${data.deleted} invalid contacts removed.`);
                loadContacts(1);
            } else {
                alert('Failed: ' + (data?.message || 'Unknown error'));
            }
        });

        loadContacts();
    </script>
</body>

</html>
