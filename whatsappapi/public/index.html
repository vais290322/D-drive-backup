<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – WhatsApp SaaS</title>
  <meta name="description" content="Sign in to your WhatsApp SaaS dashboard to manage WhatsApp connections, templates, and messages." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <h1>Whats<span>SaaS</span></h1>
        <p>Sign in to your dashboard</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <p style="text-align:center; margin-top:24px; font-size:0.88rem; color:var(--text-muted)">
        Don't have an account? <a href="/register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (getToken()) window.location.href = '/dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alertBox');
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { ok, data } = await apiFetch('/auth/login', {
        method: 'POST',
        body: { email, password },
      }).catch((err) => ({ ok: false, data: { message: err.message } }));

      if (ok) {
        setSession(data);
        window.location.href = '/dashboard.html';
      } else {
        showAlert('alertBox', data.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
